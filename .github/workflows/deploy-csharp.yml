name: Deploy C# app to Azure App Service

# Continuous deployment for the ASP.NET Core application (Task 3.2).
# Authentication uses OpenID Connect: no publishing profile or password is
# stored in the repository. The federated credential must exist for this
# repository and branch, and the service principal needs Contributor on the
# resource group.

on:
  push:
    branches: [main]
    paths:
      - 'src/DeploymentDashboard/**'
      - 'src/DeploymentConsole/**'
      - 'tests/**'
      - '.github/workflows/deploy-csharp.yml'
  workflow_dispatch:

permissions:
  id-token: write   # required for the OIDC token exchange with Microsoft Entra ID
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-swe40006-task3
  AZURE_WEBAPP_NAME: clouddeploy-swe40006
  DOTNET_VERSION: '9.0.x'

jobs:
  build-test-deploy:
    name: Build, test and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore DeploymentPortfolio.sln

      - name: Build
        run: dotnet build DeploymentPortfolio.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test tests/DeploymentDashboard.Tests/DeploymentDashboard.Tests.csproj
          -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish
        run: >
          dotnet publish src/DeploymentDashboard/DeploymentDashboard.csproj
          -c Release --no-build -o ${{ runner.temp }}/publish

      - name: Package
        run: |
          cd "${{ runner.temp }}/publish"
          zip -r "${{ runner.temp }}/app.zip" . -x '*.pdb'
          ls -lh "${{ runner.temp }}/app.zip"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        run: >
          az webapp deploy
          --resource-group "$AZURE_RESOURCE_GROUP"
          --name "$AZURE_WEBAPP_NAME"
          --src-path "${{ runner.temp }}/app.zip"
          --type zip

      - name: Smoke test the public endpoint
        run: |
          url="https://${AZURE_WEBAPP_NAME}.azurewebsites.net/health"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Health check did not return 200 in time"
          exit 1
